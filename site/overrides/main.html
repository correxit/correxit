{% extends "base.html" %}

{% block extrahead %}
  {% if page %}
    {% set title = config.site_name if page.is_homepage else (page.title | striptags) ~ " - " ~ config.site_name %}
    {% set description = page.meta.description or config.site_description %}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ config.site_name | e }}">
    <meta property="og:title" content="{{ title | e }}">
    <meta property="og:description" content="{{ description | e }}">
    <meta property="og:url" content="{{ page.canonical_url | e }}">
    <meta property="og:image" content="{{ config.extra.image | e }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <meta property="og:image:alt" content="Correxit: a corrected notebook cell in navy, white, and vermilion.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ title | e }}">
    <meta name="twitter:description" content="{{ description | e }}">
    <meta name="twitter:image" content="{{ config.extra.image | e }}">
    <meta name="twitter:image:alt" content="Correxit: a corrected notebook cell in navy, white, and vermilion.">
  {% endif %}
{% endblock %}
