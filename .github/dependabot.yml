version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /ui-tests
    schedule:
      interval: weekly
    groups:
      integration-tests:
        patterns:
          - "*"
