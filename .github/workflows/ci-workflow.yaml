name: QuantStack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Setup: Run only in QuantStack Org
  # ============================================================
  set-repo-name:
    if: github.repository_owner == 'quantstack'
    runs-on: ubuntu-slim
    outputs:
      REPO_NAME_ONLY: ${{ steps.repo.outputs.repo_name_only }}
      QS_REPO_NAME: ${{ steps.repo.outputs.qs_repo_name }}
    steps:
      - id: repo
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          QS_REPO_NAME="quantstack/$REPO_NAME"

          echo "repo_name_only=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "qs_repo_name=$QS_REPO_NAME" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: set-repo-name
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Test the extension
      run: |
        set -eux
        jlpm run test

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .

        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "correxit" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: extension-artifacts
        path: dist/correxit*
        if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-slim
    if: github.event_name == 'pull_request'
    steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        architecture: 'x64'
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" correxit*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
        python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v4
      with:
        name: extension-artifacts

    - name: Install the extension
      run: |
        set -eux
        python -m pip install "jupyterlab>=4.0.0,<5" correxit*.whl

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Set up browser cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/pw-browsers
        key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

    - name: Install browser
      run: jlpm playwright install chromium
      working-directory: ui-tests

    - name: Execute integration tests
      working-directory: ui-tests
      run: |
        jlpm playwright test

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: correxit-playwright-tests
        path: |
          ui-tests/test-results
          ui-tests/playwright-report


  # ============================================================
  # Main Branch: Mirror to Notebook-Link
  # ============================================================
  mirror-commit-to-notebook-link:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [set-repo-name]
    runs-on: ubuntu-latest
    env:
      NO_ORG_REPO_NAME: ${{ needs.set-repo-name.outputs.REPO_NAME_ONLY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Generate GitHub App token to write to notebook-link repo
        id: dest-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.NOTEBOOK_LINK_DEPLOYER_APP_ID }}
          private-key: ${{ secrets.NOTEBOOK_LINK_DEPLOYER_APP_PRIVATE_KEY }}
          owner: notebook-link
          repositories: ${{ env.NO_ORG_REPO_NAME }}

      - name: Sync commit from quantsack to notebook-link
        uses: QuantStack/cluster-app-template/.github/actions/mirror-repo@main
        with:
          source_access_token: ${{ secrets.GITHUB_TOKEN }}
          dest_access_token: ${{ steps.dest-app-token.outputs.token }}
          source_owner: "quantstack"
          dest_owner: "notebook-link"
          repo_name: ${{ env.NO_ORG_REPO_NAME }}
          ref: main
          sync_tag: "true"

  trigger-version-bump:
    needs: [mirror-commit-to-notebook-link]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          repository: QuantStack/notebook-link-jupyterlite
          event-type: trigger-deps-bump
          client-payload: '{"commitHash": "${{ github.sha }}", "libName":"correxit"}'