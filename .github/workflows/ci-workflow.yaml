name: CI

on:
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Test the extension
      run: |
        set -eux
        jlpm run test

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .

        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "correxit" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v4
      with:
        name: extension-artifacts
        path: dist/correxit*
        if-no-files-found: error

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.59.0

    - name: Install dependencies
      run: pixi run jlpm

    - name: Build and test the website
      run: |
        pixi run jlpm build:lite
        pixi run jlpm test:site

    - name: Verify the versioned website snapshot
      env:
        MIKE_DOCS_VERSION: ci
      run: |
        pixi run mkdocs build --strict
        pixi run jlpm test:site

  test_isolated:
    needs: build
    runs-on: ubuntu-slim
    steps:
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        architecture: 'x64'
    - uses: actions/download-artifact@v4
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" correxit*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
        python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - name: Download extension package
      uses: actions/download-artifact@v4
      with:
        name: extension-artifacts

    - name: Install the extension
      run: |
        set -eux
        python -m pip install "jupyterlab>=4.0.0,<5" correxit*.whl

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Install browser system dependencies
      timeout-minutes: 10
      run: jlpm playwright install-deps chromium
      working-directory: ui-tests

    - name: Execute integration tests
      working-directory: ui-tests
      run: |
        jlpm playwright test

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: correxit-playwright-tests
        path: |
          ui-tests/test-results
          ui-tests/playwright-report
