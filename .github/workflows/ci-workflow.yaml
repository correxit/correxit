name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@21b1cac622018fd37ec13a1c8081da814e10d94e # v1.0.0

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Test the extension and Node entrypoint
      run: |
        set -eux
        jlpm run test
        jlpm run test:node

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .

        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
        python -m jupyterlab.browser_check

    - name: Package the extension
      run: |
        set -eux

        pip install build
        python -m build
        pip uninstall -y "correxit" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: extension-artifacts
        path: dist/correxit*
        if-no-files-found: error

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.59.0

    - name: Install dependencies
      run: pixi run jlpm

    - name: Build and test the website
      run: |
        mkdir -p lite/files/.ci-hidden lite/_output/files/.ci-stale
        touch lite/files/.ci-hidden/file.txt lite/files/.ci-hidden.txt
        touch lite/_output/files/.ci-stale/file.txt lite/_output/files/.ci-stale.txt
        pixi run jlpm build:lite
        pixi run jlpm test:site

    - name: Verify the versioned website snapshot
      env:
        MIKE_DOCS_VERSION: ci
      run: |
        NO_MKDOCS_2_WARNING=true pixi run mkdocs build --strict
        pixi run jlpm test:site

  test_isolated:
    needs: build
    runs-on: ubuntu-slim
    steps:
    - name: Install Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.9'
        architecture: 'x64'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" correxit*.whl


        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
        python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome

    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@21b1cac622018fd37ec13a1c8081da814e10d94e # v1.0.0

    - name: Download extension package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: extension-artifacts

    - name: Install the extension
      run: |
        set -eux
        python -m pip install "jupyterlab>=4.0.0,<5" correxit*.whl

    - name: Install dependencies
      working-directory: ui-tests
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: 0
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Install browser system dependencies
      timeout-minutes: 10
      run: jlpm playwright install-deps chromium
      working-directory: ui-tests

    - name: Execute integration tests
      working-directory: ui-tests
      run: |
        jlpm playwright test

    - name: Upload Playwright Test report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: correxit-playwright-tests
        path: |
          ui-tests/test-results
          ui-tests/playwright-report
