name: Publish contracts package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: contracts-package-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'correxit/correxit' &&
      !github.event.repository.private &&
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'contracts-v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Require a published stable contracts release
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^contracts-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Choose a stable contracts release tag such as contracts-v1.0.0.'
            exit 1
          fi
          published=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)')
          if [ "$published" != true ]; then
            echo '::error::The selected release must be published and must not be a prerelease.'
            exit 1
          fi

      - name: Checkout the release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify the release version
        id: version
        run: |
          version=$(jq -r .version packages/contracts/package.json)
          if [ "contracts-v$version" != "$RELEASE_TAG" ]; then
            echo '::error::The release tag must match the version in packages/contracts/package.json.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the tested packages
        run: |
          commit=$(git rev-parse HEAD)
          run=$(gh run list --workflow ci-workflow.yaml --branch main \
            --commit "$commit" --event push --limit 1 \
            --json databaseId,conclusion \
            --jq '.[0] | select(.conclusion == "success") | .databaseId')
          if [ -z "$run" ]; then
            echo '::error::The release commit must have successful push-triggered CI on main.'
            exit 1
          fi
          gh run download "$run" --name contracts-npm-artifact --dir dist

      - name: Verify the package version and contents
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import tarfile

          version = os.environ['VERSION']
          archive = f"dist/correxit-contracts-{version}.tgz"
          if not os.path.exists(archive):
              raise SystemExit(f"Archive missing: {archive}")

          with tarfile.open(archive, "r:gz") as tar:
              package_json = tar.extractfile("package/package.json")
              if package_json is None:
                  raise SystemExit("package.json missing from npm archive")
              data = json.load(package_json)
              if data.get("name") != "@correxit/contracts":
                  raise SystemExit(f"Expected package name @correxit/contracts, got {data.get('name')}")
              if data.get("version") != version:
                  raise SystemExit(f"npm package version {data.get('version')} does not match {version}")
          PY

      - name: Upload the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-contracts-npm
          path: dist/correxit-contracts-*.tgz
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@correxit/contracts/v/${{ needs.prepare.outputs.version }}
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download the tested npm package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-contracts-npm
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Check whether publication is needed
        id: registry
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';

          const { VERSION: version, GITHUB_OUTPUT: output } = process.env;
          const response = await fetch('https://registry.npmjs.org/@correxit%2Fcontracts');
          if (response.status === 404) {
            appendFileSync(output, 'publish=true\ntag=latest\n');
            console.log(`Initial release of @correxit/contracts@${version}`);
            process.exit(0);
          }
          if (!response.ok) throw new Error(`Registry lookup failed: ${response.status}`);
          const registry = await response.json();
          const published = registry.versions?.[version];
          const archive = `dist/correxit-contracts-${version}.tgz`;
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync(archive)).digest('base64');
          if (published && published.dist.integrity !== integrity) {
            throw new Error('This npm version already exists with different package contents.');
          }
          const latest = registry['dist-tags']?.latest;
          const compare = (a, b) => {
            if (!b) return 1;
            const left = a.split('.').map(Number);
            const right = b.split('.').map(Number);
            return left.map((value, index) => value - right[index]).find(value => value !== 0) ?? 0;
          };
          const tag = compare(version, latest) >= 0 ? 'latest' : `release-${version}`;
          appendFileSync(output, `publish=${!published}\ntag=${tag}\n`);
          console.log(published ? `Verified existing @correxit/contracts@${version}` : `Publishing @correxit/contracts@${version} with tag ${tag}`);
          JS

      - name: Publish with trusted publishing
        if: steps.registry.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ steps.registry.outputs.tag }}
        run: npm publish "./dist/correxit-contracts-$VERSION.tgz" --access public --provenance --ignore-scripts --tag "$DIST_TAG"

