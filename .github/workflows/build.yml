name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  version-bump-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump-version-check.outputs.version }}
      success: ${{ steps.bump-version-check.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump version
        id: bump-version-check
        uses: ./.github/actions/bump-version
        with:
          dry_run: 'true'
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  build-package-check:
    if: github.event_name == 'pull_request' && needs.version-bump-check.outputs.success == 'true'
    needs: [version-bump-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Lint the extension
        run: |
          set -eux
          jlpm
          jlpm run lint:check

      - name: Test the extension
        run: |
          set -eux
          jlpm run test

      - name: Build the extension
        run: |
          set -eux
          python -m pip install .

          jupyter server extension list
          jupyter server extension list 2>&1 | grep -ie "correxit.*OK"

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "correxit.*OK"
          python -m jupyterlab.browser_check

      - name: Package the extension
        run: |
          set -eux

          pip install build
          python -m build
          pip uninstall -y "correxit" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: dist/correxit*
          if-no-files-found: error
          
  version-bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump-version.outputs.version }}
      success: ${{ steps.bump-version.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bump version
        id: bump-version
        uses: ./.github/actions/bump-version
        with:
          github_token: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  publish:
    needs: [version-bump]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version-bump.outputs.success == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Configure Registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'yarn'

      - name: Publish package
        run: |
          set -eux
          corepack enable
          corepack prepare yarn@3.5.0 --activate
          python -m pip install -U "jupyterlab>=4.0.0,<5"

          yarn install
          yarn run build:lib
          
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access internal  #  Explicitly set public access.

        env:
          VERSION: ${{ needs.version-bump.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YARN_ENABLE_IMMUTABLE_INSTALLS: '0'
          NPM_CONFIG_PACKAGE_LOCK: 'false'
